[project]
name = "qstock-mcp"
version = "0.1.0"
description = "面向 AI agent 的证券数据 MCP 服务：init / fetch / proxy / query / conclusions"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2",
    "psycopg2-binary",
]

[project.optional-dependencies]
dev = ["pytest", "mypy"]
# 真实数据源库：适配层懒加载，未安装时对应源报明确错误
sources = ["efinance", "akshare", "baostock"]
# 成分字典文件导入（issue #73）：解析层懒加载，未安装时报明确错误
classify = ["xlrd>=2"]

[project.scripts]
qstock-mcp = "qstock_mcp.server:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qstock_mcp = ["sql/*.sql", "data/*.csv"]
